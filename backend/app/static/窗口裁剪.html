<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>窗口裁剪 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html">左轨流水</a>
          <a href="/右轨.html">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/悬账单.html">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
          <a href="/窗口裁剪.html" class="亮">窗口裁剪</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>窗口裁剪</h1>
        <p class="说明">跑对齐时按事件时相对窗起/窗止择定命运：纳入进现行对齐集；窗外按形态落旁路账册（旁路）或打窗外标差行（打标）。改窗后旧裁剪行 valid=0，须重跑对齐。</p>
        <div class="工具条">
          <button class="次" id="刷">刷新</button>
        </div>
        <div class="标签行" id="策略"></div>
        <pre class="报" id="报"></pre>
      </section>
      <section class="行卡">
        <h2>裁剪命运（只读）</h2>
        <div id="裁表"></div>
      </section>
      <section class="行卡">
        <h2>旁路账册（窗外 · 旁路形态）</h2>
        <div id="旁表"></div>
      </section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const paint = async () => {
    const 规 = await get("/api/轨规");
    const rows = await get("/api/窗口裁剪");
    const 旁 = await get("/api/旁路账册");
    const 失效 = rows.filter(r => !r.valid).length;
    document.getElementById("策略").innerHTML = [
      ["对齐窗起", 规.对齐窗起 || "-∞"], ["对齐窗止", 规.对齐窗止 || "+∞"],
      ["窗外形态", 规.窗外形态 || "旁路"], ["裁剪失效", 失效]
    ].map(([k,v]) => `<span class="标签">${k}：${v}</span>`).join("");
    document.getElementById("报").textContent = 失效 > 0
      ? "窗口裁剪已失效：改窗后未重跑对齐，请到「对齐差表」点「跑对齐」。"
      : "";
    document.getElementById("裁表").innerHTML = 表(
      ["编号","业务键","轨别","事件编号","事件时","窗起","窗止","命运","valid","时刻"],
      rows,
      r => `<td>${r.编号}</td><td>${r.业务键}</td><td>${r.轨别}</td><td>${r.事件编号||"-"}</td>
        <td>${r.事件时}</td><td>${r.窗起||"-∞"}</td><td>${r.窗止||"+∞"}</td>
        <td>${徽(r.命运)}</td><td>${r.valid ? "1" : "0"}</td><td>${r.时刻}</td>`
    );
    document.getElementById("旁表").innerHTML = 表(
      ["编号","业务键","轨别","事件编号","金额分","事件时","窗起","窗止","原因","时刻"],
      旁,
      r => `<td>${r.编号}</td><td>${r.业务键}</td><td>${r.轨别}</td><td>${r.事件编号||"-"}</td>
        <td>${r.金额分}</td><td>${r.事件时}</td><td>${r.窗起||"-∞"}</td><td>${r.窗止||"+∞"}</td>
        <td>${r.原因}</td><td>${r.时刻}</td>`
    );
  };
  await paint();
  document.getElementById("刷").onclick = paint;
})();
</script>
</body>
</html>
